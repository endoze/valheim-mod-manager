# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
enable_free_tier: true

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  path_filters:
    - "!Cargo.lock"
    - "!target/**"
    - "!coverage/**"
    - "!CHANGELOG.md"
  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        Public items need rustdoc covering the contract: purpose, invariants,
        errors, panics, and an example where it helps. Inline `//` comments are
        only warranted for a why the code cannot state (a workaround and its
        reason, a drop-order dependency, a deliberate fail-closed choice).
        Flag inline comments that restate what the code does or describe a
        dependency's internals.

        `vmm` is a Valheim mod manager CLI on top of `thunderstore-engine`, which
        owns downloads, extraction, profile layout, and the install record. Flag
        vmm code that duplicates or bypasses the engine. User-facing refusals go
        through `AppError::advice` (headline, why, commands to run) and say what
        was left unchanged. Keep `#[cfg(unix)]`/`target_os` gates intact:
        releases ship Linux and Windows. Tests sit in `#[cfg(test)]` modules and
        use `test_support::Fixture` (a mock Thunderstore), never the network.
        rustfmt uses `tab_spaces = 2`.

        Do not comment on style that `cargo fmt` or
        `cargo clippy --all-targets --all-features -- -D warnings` already
        enforces.
    - path: "tests/**/*.rs"
      instructions: |
        Check that tests assert behavior rather than restating the
        implementation, and that new public API or bugfixes come with
        coverage.
    - path: ".github/workflows/**"
      instructions: |
        Every third-party action must be pinned to a full commit SHA with the
        version in a trailing comment (`uses: owner/action@<sha> # vX.Y.Z`).
        release.yml is generated by dist: change dist-workspace.toml (action SHAs and
        version comments live in `[dist.github-action-commits]`) and regenerate. dist alone creates GitHub Releases (release-plz.toml keeps `git_release_enable = false`).
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Stacked PRs target the branch below them, not just master.
    base_branches:
      - ".*"
  tools:
    clippy:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true

chat:
  art: false
  auto_reply: true
  allow_non_org_members: false

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
